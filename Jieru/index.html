<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- SEO：關閉 Google 搜尋 -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龎婕如 | 個人數位名片</title>
    <!-- 引入 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
      --bg-color: #F0F4F8;
      --card-bg: #FFFFFF;
      --primary-color: #1A365D; /* 深海藍 */
      --accent-color: #C5A059; /* 香檳金 */
      --text-main: #2D3748;
      --text-sub: #718096;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 👑 NFC 專屬開場動畫樣式 */
        #nfc-loader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        #nfc-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .nfc-waves {
            position: relative;
            width: 120px; height: 120px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 發射波紋效果 */
        .nfc-wave {
            position: absolute;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            animation: ripple 2s cubic-bezier(0.21, 0.53, 0.56, 0.8) infinite;
            opacity: 0;
        }
        .nfc-wave:nth-child(1) { width: 40px; height: 40px; animation-delay: 0s; }
        .nfc-wave:nth-child(2) { width: 80px; height: 80px; animation-delay: 0.6s; }
        .nfc-wave:nth-child(3) { width: 120px; height: 120px; animation-delay: 1.2s; }
        
        .nfc-icon-center {
            position: relative;
            z-index: 2;
            font-size: 28px;
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            width: 56px; height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            animation: float 2s ease-in-out infinite;
        }

        @keyframes ripple {
            0% { transform: scale(0.5); opacity: 0; }
            40% { opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .nfc-loading-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: 3px;
            animation: pulseText 1.5s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* 原本主容器樣式 */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            border-top: 6px solid var(--primary-color);
        }

        /* 橫向 LOGO 圖片 */
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            border: 4px solid #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,.15);
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .job-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--accent-color);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* 公司資訊卡片 */
        .company-card {
            background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%);
            border: 1px solid #E2E8F0;
            border-left: 4px solid var(--accent-color);
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0 25px 0;
            text-align: left;
        }
        .company-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
            line-height: 1.4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .company-tax {
            font-size: 12px;
            font-weight: normal;
            color: var(--text-sub);
        }
        .company-subtitle {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.4;
        }

        /* 聯絡資訊列表 */
        .contact-info {
            background-color: #FFFFFF;
            margin-bottom: 25px;
            text-align: left;
        }
        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #E2E8F0;
            font-size: 16px;
            font-family: sans-serif;
        }
        .contact-item:last-child {
            border-bottom: none;
        }
        .contact-icon-wrapper {
            width: 36px;
            height: 36px;
            background-color: rgba(0, 0, 0, 0.03);
            color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 16px;
        }
        .contact-item a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 500;
        }
        .contact-item a:hover {
            color: var(--primary-color);
        }
        .contact-label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 2px;
        }
        .contact-value {
            display: flex;
            flex-direction: column;
        }

        /* 按鈕區塊 */
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-family: sans-serif;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn i {
            font-size: 20px;
            margin-right: 12px;
        }

        /* VCF 專屬按鈕風格 */
        .btn-vcf {
            background-color: var(--accent-color);
            color: var(--primary-color);
            box-shadow: 0 6px 15px rgba(0,0,0, 0.08);
            font-weight: 700;
        }

        .btn-call {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0, 0.1);
        }
        .btn-line {

        }
        .footer {

            font-size: 12px;
            color: #A0AEC0;
            font-family: sans-serif;
        }
    </style>
