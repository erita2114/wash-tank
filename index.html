<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洗缸了沒｜高雄魚缸清洗</title>

<link href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn.css" rel="stylesheet">

<style>
:root {
    --bg-color: #f0faff;
    --tank-border: #ffffff;
    --water-top: #e0f7ff;
    --water-bottom: #bae6fd;
    --main-blue: #0ea5e9;
}

body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg-color);
    overflow-x: hidden;
    color: #1e293b;
}

/* ===== NAVBAR ===== */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    padding: 10px 30px;
    z-index: 999;
}

.logo-small {
    height: 100px;
    margin-right: 10px;
}

.brand-text {
    display: flex;
    flex-direction: column;
}

.brand-title {
    font-family: 'jf-openhuninn', 'Noto Sans TC', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #0369a1;
}

.brand-sub {
    font-size: 13px;
    color: #475569;
}

/* --- HERO --- */
.hero {
    min-height: 50vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 20px; /* 預留navbar空間 */
}

.tank-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16 / 10;
    margin-top: 40px;
}

.aquarium-tank {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, var(--water-top) 0%, var(--water-bottom) 100%);
    border: 12px solid var(--tank-border);
    border-radius: 50px 50px 80px 80px;
    box-shadow: 0 30px 60px rgba(14, 165, 233, 0.2), inset 0 0 50px rgba(255, 255, 255, 0.5);
    overflow: hidden;
    z-index: 1;
}

/* HERO內容 */
.hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    pointer-events: none;
}

.hero-logo {
    width: clamp(320px, 55vw, 480px);
    margin-bottom: 10px;
}

.hero-sub {
    font-family: 'jf-openhuninn', 'Noto Sans TC', sans-serif;
}

/* 魚動畫 */
.fish-box { position: absolute; width: 100%; height: 100%; }

.fish {
    position: absolute;
    font-size: clamp(30px, 6vw, 55px);
}

@keyframes swim-right {
    0% { left: -10%; transform: scaleX(-1); }
    50% { left: 100%; transform: scaleX(-1); }
    51% { transform: scaleX(1); }
    100% { left: -10%; transform: scaleX(1); }
}

@keyframes swim-left {
    0% { right: -10%; transform: scaleX(1); }
    50% { right: 100%; transform: scaleX(1); }
    51% { transform: scaleX(-1); }
    100% { right: -10%; transform: scaleX(-1); }
}

.fish-a { top: 15%; animation: swim-right 14s infinite linear; }
.fish-b { top: 45%; animation: swim-left 18s infinite linear; }
.fish-c { top: 75%; animation: swim-right 22s infinite linear; }

/* 按鈕 */
.btn {
    margin-top: 20px;
    display: inline-block;
    padding: 15px 40px;
    background: var(--main-blue);
    color: white;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    pointer-events: auto;
}

/* 其他 */
.section { padding: 60px 20px; max-width: 1100px; margin: auto; }
.section h2 { text-align: center; color: #0369a1; font-size: 32px; margin-bottom: 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
.card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e0f2fe; }

footer { text-align: center; padding: 40px; color: #94a3b8; }

@media (max-width: 600px) {
    .tank-container { aspect-ratio: 1 / 1.2; }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <img src="images/logo.png" class="logo-small">
    <div class="brand-text">
        <div class="brand-title">洗缸了沒</div>
        <div class="brand-sub">高雄魚缸清洗｜到府保養服務</div>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <div class="tank-container">
        <div class="aquarium-tank">
            <div class="fish-box">
                <div class="fish fish-a">🐠</div>
                <div class="fish fish-b">🐟</div>
                <div class="fish fish-c">🐡</div>
            </div>
        </div>
        
        <div class="hero-content">
            <!-- 主LOGO -->
            <img src="images/logo2.png" class="hero-logo">
            
            <!-- 副標 -->
            <div class="hero-sub">高雄魚缸清洗｜到府保養服務</div>

            <a href="#" class="btn">立即預約服務</a>
        </div>
    </div>
</section>

<section class="section">
    <h2>專業服務項目</h2>
    <div class="grid">
        <div class="card">🧼 魚缸清洗</div>
        <div class="card">🔄 濾材更換</div>
        <div class="card">💧 水質檢測</div>
        <div class="card">⚙️ 設備維護</div>
        <div class="card">🐟 健康評估</div>
    </div>
</section>

<section class="section">
    <h2>收費參考</h2>
    <div class="grid">
        <div class="card">小型魚缸<br><b>$800 起</b></div>
        <div class="card">中型魚缸<br><b>$1200 起</b></div>
        <div class="card">大型魚缸<br><b>$2000 起</b></div>
    </div>
</section>

<footer>
© 洗缸了沒｜高雄專業魚缸保養
</footer>

</body>
</html>
